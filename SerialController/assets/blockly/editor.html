<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Blocklyエディタ</title>
<script src="./blockly_compressed.js"></script>
<script src="./blocks_compressed.js"></script>
<script src="./python_compressed.js"></script>
<script src="./msg/ja.js"></script>
<script src="./pokecon_blocks.js"></script>
<script src="./pokecon_capture.js"></script>
<style>
html, body { height: 100%; margin: 0; }
#bar { padding: 8px; display: flex; gap: 8px; align-items: center; }
#ws { height: calc(100% - 48px); width: 100%; }
#status { color: #333; }
#capmodal { display: none; position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; overflow: auto; }
#capmodalbox { background: #fff; margin: 2vh auto; padding: 12px; width: fit-content; max-width: 96vw; }
#capbigimg { max-width: 90vw; max-height: 66vh; border: 1px solid #999; cursor: crosshair; }
.caphandle { position: absolute; width: 8px; height: 8px; background: #f00; border: 1px solid #fff; display: none; }
.capdim { position: absolute; background: rgba(0,0,0,0.65); color: #fff; font-size: 11px; padding: 1px 4px; display: none; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div id="bar">
<label>保存名 <input id="stem" value="MyBlock"></label>
<button id="save">保存</button>
<span id="status"></span>
</div>
<div id="bar2" style="padding: 0 8px 8px; display: flex; gap: 8px; align-items: center;">
<label>保存済み <select id="files"></select></label>
<button id="open">開く</button>
<button id="del">削除</button>
<label>画像 <select id="tpllist"></select></label>
<button id="tplapply">選択中へ反映</button>
</div>
<div id="bar3" style="padding: 0 8px 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
<button id="capget">キャプチャ取得</button>
<span id="capwrap" style="position: relative; display: none;">
<img id="capimg" alt="キャプチャ" style="max-width: 320px; max-height: 180px; border: 1px solid #999; cursor: crosshair;">
<div id="caprect" style="position: absolute; border: 2px solid #f00; display: none; pointer-events: none;"></div>
</span>
<label>保存名 <input id="capname" value="" placeholder="例: mark"></label>
<button id="capsave" disabled>切出し保存</button>
<span id="capstatus"></span>
</div>
<!-- 上部の仮想スティック区画は非表示（ブロック内蔵パッドへ移行）。DOMは残す。 -->
<div id="bar4" style="padding: 0 8px 8px; display: none; gap: 8px; align-items: center; flex-wrap: wrap;">
<span>スティック</span>
<span id="stickpad" style="position: relative; display: inline-block; width: 120px; height: 120px; border: 1px solid #999; border-radius: 50%; background: #f4f4f4; cursor: crosshair; touch-action: none;">
<span id="stickdot" style="position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #06c; left: 54px; top: 54px; pointer-events: none;"></span>
</span>
<label>L/R <select id="stickside"><option value="LEFT">L</option><option value="RIGHT">R</option></select></label>
<label>角度 <input id="stickangle" type="number" min="0" max="360" step="1" value="90" style="width: 5em;"></label>
<label>強さ <input id="stickmag" type="number" min="0" max="100" step="1" value="100" style="width: 5em;"></label>
<button id="stickapply">選択中へ反映</button>
<span id="stickstatus"></span>
</div>
<div id="capmodal">
<div id="capmodalbox">
<div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
<span id="capmodalhint">範囲を選択してください（枠内ドラッグで移動・赤い点で大きさ変更・数値でも指定可）</span>
<span id="capmodelabel" style="color: #666;"></span>
<button id="capmodalclose">× 閉じる</button>
</div>
<div id="capblockrow" style="display: none; gap: 8px; align-items: center; margin-bottom: 8px;">
<label>テンプレ <select id="capblocktpl"></select></label>
</div>
<span id="capbigwrap" style="position: relative; display: inline-block;">
<img id="capbigimg" alt="キャプチャ拡大">
<div id="capbigrect" style="position: absolute; border: 2px solid #f00; display: none; pointer-events: none;"></div>
<div id="capmatchrect" style="position: absolute; border: 3px solid #00f; display: none; pointer-events: none;"></div>
<div id="caph-nw" class="caphandle" style="cursor: nwse-resize;"></div>
<div id="caph-n" class="caphandle" style="cursor: ns-resize;"></div>
<div id="caph-ne" class="caphandle" style="cursor: nesw-resize;"></div>
<div id="caph-e" class="caphandle" style="cursor: ew-resize;"></div>
<div id="caph-se" class="caphandle" style="cursor: nwse-resize;"></div>
<div id="caph-s" class="caphandle" style="cursor: ns-resize;"></div>
<div id="caph-sw" class="caphandle" style="cursor: nesw-resize;"></div>
<div id="caph-w" class="caphandle" style="cursor: ew-resize;"></div>
<div id="capdimxy" class="capdim"></div>
<div id="capdimwh" class="capdim"></div>
</span>
<div style="display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap;">
<span style="display: inline-flex; gap: 4px; align-items: center; white-space: nowrap;">x <input id="capx" type="number" step="1" style="width: 5em;"><input id="caprx" type="range" min="0" value="0" style="width: 90px;"></span>
<span style="display: inline-flex; gap: 4px; align-items: center; white-space: nowrap;">y <input id="capy" type="number" step="1" style="width: 5em;"><input id="capry" type="range" min="0" value="0" style="width: 90px;"></span>
<span style="display: inline-flex; gap: 4px; align-items: center; white-space: nowrap;">幅 <input id="capw" type="number" step="1" style="width: 5em;"><input id="caprw" type="range" min="0" value="0" style="width: 90px;"></span>
<span style="display: inline-flex; gap: 4px; align-items: center; white-space: nowrap;">高さ <input id="caph" type="number" step="1" style="width: 5em;"><input id="caprh" type="range" min="0" value="0" style="width: 90px;"></span>
<span style="color: #666; white-space: nowrap;">（実画像の画素・マウスでも上下可）</span>
<span style="display: inline-flex; gap: 8px; align-items: center; white-space: nowrap;"><button id="capretake">取り直す</button><button id="capok">確定</button><button id="capcancel">キャンセル</button></span>
<span id="capmodalstatus"></span>
</div>
<div style="display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap;">
<span style="display: inline-flex; gap: 4px; align-items: center; white-space: nowrap;">テンプレ <select id="capmatchtpl"></select><span id="capmatchsize" style="color: #666;"></span></span>
<span style="display: inline-flex; gap: 4px; align-items: center; white-space: nowrap;">しきい値 <input id="capth" type="number" step="0.01" min="0" max="1" value="0.7" style="width: 5em;"><input id="caprth" type="range" min="0" max="1" step="0.01" value="0.7" style="width: 120px;"></span>
<label style="white-space: nowrap;"><input type="checkbox" id="capgray" checked> グレー</label>
<label style="white-space: nowrap;"><input type="checkbox" id="caproionly"> 赤枠内のみ</label>
<span id="capmatchstatus"></span>
<span id="capmatchcrop" style="color: #666;"></span>
</div>
<div id="capfiltrow" style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;">
<span>色フィルタ <select id="capfilt_mode"><option value="off">OFF</option><option value="gray_out">対象外グレー</option><option value="mask">白黒</option></select></span>
<span>H下限 <input id="caph1" type="number" min="0" max="179" value="0"></span>
<span>S下限 <input id="caps1" type="number" min="0" max="255" value="0"></span>
<span>V下限 <input id="capv1" type="number" min="0" max="255" value="0"></span>
<span>H上限 <input id="caph2" type="number" min="0" max="179" value="179"></span>
<span>S上限 <input id="caps2" type="number" min="0" max="255" value="255"></span>
<span>V上限 <input id="capv2" type="number" min="0" max="255" value="255"></span>
<span>割合 <input id="capratio" type="number" min="0" max="1" step="0.01" value="0.6"></span>
<span id="capfiltratio" style="color:#666;"></span>
</div>
<div><img id="capfiltimg" alt="フィルタ" style="max-width:90vw;max-height:30vh;border:1px solid #999;display:none;"></div>
<div style="display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap;">
<label>画像ファイル <input id="capupload" type="file" accept="image/*"></label>
<span id="capuploadname" style="color: #666;"></span>
</div>
<div style="display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap;">
<label>保存名 <input id="capmodalname" value="" placeholder="例: mark"></label>
<button id="capmodalsave">切出し保存</button>
</div>
</div>
</div>
<div id="ws"></div>
<script>
(function () {
  'use strict';
  // 生成器は Blockly.Python に付く（pythonGenerator 大域は無い）。
  var pythonGenerator =
    (typeof Blockly !== 'undefined' && Blockly.Python) || null;
  var ws = Blockly.inject('ws', {
    toolbox: {
      kind: 'categoryToolbox',
      contents: [
        {
          kind: 'category', name: 'PokeCon',
          contents: [
            { kind: 'block', type: 'pokecon_program' },
            { kind: 'block', type: 'pokecon_sub_def' },
            { kind: 'block', type: 'pokecon_sub_call' },
            { kind: 'block', type: 'pokecon_sub_call_value' },
            { kind: 'block', type: 'pokecon_comment' },
            { kind: 'block', type: 'pokecon_press' },
            { kind: 'block', type: 'pokecon_stick' },
            { kind: 'block', type: 'pokecon_wait' },
            { kind: 'block', type: 'pokecon_hold' },
            { kind: 'block', type: 'pokecon_hold_end' },
            { kind: 'block', type: 'pokecon_finish' },
            { kind: 'block', type: 'pokecon_press_rep' },
            { kind: 'block', type: 'pokecon_print' },
            { kind: 'block', type: 'pokecon_screenshot' },
            { kind: 'block', type: 'pokecon_discord' },
          ],
        },
        {
          kind: 'category', name: '画像認識',
          contents: [
            { kind: 'block', type: 'pokecon_vision_contains' },
            { kind: 'block', type: 'pokecon_vision_wait_appear' },
            { kind: 'block', type: 'pokecon_vision_wait_gone' },
            { kind: 'block', type: 'pokecon_vision_position' },
            { kind: 'block', type: 'pokecon_vision_wait_stable' },
            { kind: 'block', type: 'pokecon_vision_color' },
          ],
        },
        {
          kind: 'category', name: '音声',
          contents: [
            { kind: 'block', type: 'pokecon_audio_tone_contains' },
            { kind: 'block', type: 'pokecon_audio_wait_tone' },
          ],
        },
        {
          kind: 'category', name: '標準',
          contents: [
            { kind: 'block', type: 'controls_repeat' },
            { kind: 'block', type: 'controls_whileUntil' },
            { kind: 'block', type: 'controls_if' },
            { kind: 'block', type: 'controls_flow_statements' },
            { kind: 'block', type: 'logic_compare' },
            { kind: 'block', type: 'logic_operation' },
            { kind: 'block', type: 'logic_negate' },
            { kind: 'block', type: 'math_number' },
            { kind: 'block', type: 'math_arithmetic' },
            { kind: 'block', type: 'math_modulo' },
            { kind: 'block', type: 'math_change' },
            { kind: 'block', type: 'math_random_int' },
            { kind: 'block', type: 'math_random_float' },
            { kind: 'block', type: 'text' },
            { kind: 'block', type: 'text_join' },
            { kind: 'block', type: 'variables_get' },
            { kind: 'block', type: 'variables_set' },
          ],
        },
      ],
    },
  });
  function setStatus(s, isErr) {
    var el = document.getElementById('status');
    el.textContent = s;
    el.style.color = isErr ? '#c00' : '#333';
    el.style.fontWeight = isErr ? 'bold' : 'normal';
  }
  function refreshFiles(keep) {
    fetch('./list').then(function (r) { return r.json(); }).then(function (j) {
      var sel = document.getElementById('files');
      sel.textContent = '';
      (j.stems || []).forEach(function (name) {
        var opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        sel.appendChild(opt);
      });
      if (keep) { sel.value = keep; }
    }).catch(function (e) { setStatus('一覧を読めません: ' + e, true); });
  }
  function refreshTemplates() {
    return fetch('./templates').then(function (r) { return r.json(); }).then(function (j) {
      var sel = document.getElementById('tpllist');
      sel.textContent = '';
      (j.templates || []).forEach(function (name) {
        var opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        sel.appendChild(opt);
      });
      Blockly.PokeconTemplates = j.templates || [];
    }).catch(function () { /* 候補なしでも保存はできる */ });
  }
  // ボタン押下でDOMフォーカスがBlockly外へ移るとFocusManagerが選択を外すため、
  // click時点の getSelected() は空になる。SELECTEDイベントでテンプレ欄つき
  // ブロックを覚えておき、空のときの fallback に使う（解除時は保持、
  // テンプレ欄なしへの切替時は破棄）。
  var lastTplBlockId = null;
  var SELECTED_TYPE =
    (Blockly.Events && Blockly.Events.SELECTED) || 'selected';
  ws.addChangeListener(function (e) {
    if (!e || e.type !== SELECTED_TYPE) { return; }
    var id = e.newElementId || null;
    var b = id ? ws.getBlockById(id) : null;
    if (b && typeof b.getField === 'function' && b.getField('TEMPLATE')) {
      lastTplBlockId = id;
    } else if (id) {
      lastTplBlockId = null;
    }
  });
  // 選択中→記憶の順でテンプレ欄つきブロックを探す。needCrop が真のときは
  // 範囲欄も必須にする（ブロック用modal向け）。
  function resolveTplBlock(needCrop) {
    var target =
      (typeof Blockly.getSelected === 'function') ? Blockly.getSelected() : null;
    if (!target || typeof target.getField !== 'function' || !target.getField('TEMPLATE')) {
      target = lastTplBlockId ? ws.getBlockById(lastTplBlockId) : null;
    }
    if (!target || typeof target.getField !== 'function' || !target.getField('TEMPLATE')) {
      return null;
    }
    if (needCrop && !target.getField('CROP')) {
      return null;
    }
    return target;
  }
  document.getElementById('tplapply').addEventListener('click', function () {
    var name = document.getElementById('tpllist').value;
    if (!name) { setStatus('画像を選んでください', true); return; }
    var target = resolveTplBlock(false);
    if (!target) {
      setStatus('テンプレ欄のあるブロックを選んでください', true);
      return;
    }
    target.setFieldValue(name, 'TEMPLATE');
    setStatus('反映しました: ' + name, false);
  });
  document.getElementById('save').addEventListener('click', function () {
    if (!pythonGenerator) {
      setStatus('生成器がありません（python_compressed.js の読込を確認してください）', true);
      return;
    }
    var programs = ws.getTopBlocks(false).filter(function (b) { return b.type === 'pokecon_program'; });
    if (programs.length === 0) {
      setStatus('「プログラム」ブロックを置き、その中に操作を並べてください（単体では保存できません）', true);
      return;
    }
    if (programs.length > 1) {
      setStatus('「プログラム」は1個までにしてください（今' + programs.length + '個あります）', true);
      return;
    }
    var stem = document.getElementById('stem').value;
    var state = Blockly.serialization.workspaces.save(ws);
    var code = pythonGenerator.workspaceToCode(ws);
    fetch('./save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stem: stem, workspaceJson: JSON.stringify(state), pythonCode: code }),
    }).then(function (r) { return r.json(); }).then(function (j) {
      var msg = j.message || (j.ok ? '保存しました' : '保存できません');
      if (j.warnings && j.warnings.length) { msg += '\n' + j.warnings.join('\n'); }
      setStatus(msg, !j.ok);
      if (j.ok) { refreshFiles(stem); }
    }).catch(function (e) { setStatus('保存できません: ' + e, true); });
  });
  document.getElementById('open').addEventListener('click', function () {
    var sel = document.getElementById('files');
    var stem = sel.value;
    if (!stem) { setStatus('開くものを選んでください', true); return; }
    if (ws.getAllBlocks(false).length > 0 &&
        !window.confirm('編集中の内容を捨てて「' + stem + '」を開きますか？')) {
      return;
    }
    // 候補取得を待ってから開く。TEMPLATE欄がdropdownのため、
    // 一覧未到達で開くと保存値が候補外ではねられて既定値に化ける。
    refreshTemplates().then(function () {
      return fetch('./load?stem=' + encodeURIComponent(stem));
    }).then(function (r) {
      return r.json();
    }).then(function (j) {
      if (!j.ok) { setStatus(j.message || '開けません', true); return; }
      ws.clear();
      Blockly.serialization.workspaces.load(JSON.parse(j.workspaceJson), ws);
      ws.getAllBlocks(false).forEach(function (b) {
        if (typeof b.getField !== 'function') { return; }
        var t = b.getField('TEMPLATE'), p = b.getField('PREVIEW');
        if (t && p) {
          var v = t.getValue();
          p.setValue(v
            ? './template_image?name=' + encodeURIComponent(v)
            : 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==');
        }
      });
      document.getElementById('stem').value = j.stem || stem;
      setStatus('開きました: ' + stem, false);
    }).catch(function (e) { setStatus('開けません: ' + e, true); });
  });
  document.getElementById('del').addEventListener('click', function () {
    var sel = document.getElementById('files');
    var stem = sel.value;
    if (!stem) { setStatus('消すものを選んでください', true); return; }
    if (!window.confirm('「' + stem + '」を削除しますか？（.py と編集データの対を消します）')) {
      return;
    }
    fetch('./delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stem: stem }),
    }).then(function (r) { return r.json(); }).then(function (j) {
      setStatus(j.message || (j.ok ? '削除しました' : '削除できません'), !j.ok);
      refreshFiles();
    }).catch(function (e) { setStatus('削除できません: ' + e, true); });
  });
  var capRect01 = null;
  var dragStart = null;
  function capSetStatus(s, isErr) {
    var el = document.getElementById('capstatus');
    el.textContent = s;
    el.style.color = isErr ? '#c00' : '#333';
    el.style.fontWeight = isErr ? 'bold' : 'normal';
  }
  function capDraw() {
    var box = document.getElementById('caprect');
    var img = document.getElementById('capimg');
    if (!capRect01) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    box.style.left = (capRect01.x * img.offsetWidth) + 'px';
    box.style.top = (capRect01.y * img.offsetHeight) + 'px';
    box.style.width = (capRect01.width * img.offsetWidth) + 'px';
    box.style.height = (capRect01.height * img.offsetHeight) + 'px';
  }
  function capFetch() {
    capSetStatus('取得しています…', false);
    fetch('./frame').then(function (r) {
      var ct = r.headers.get('Content-Type') || '';
      if (ct.indexOf('image/png') !== -1) {
        return r.blob().then(function (b) { return { img: b }; });
      }
      return r.json().then(function (j) { return { err: j.message || '取得できません' }; });
    }).then(function (res) {
      if (res.err) {
        capSetStatus(res.err, true);
        document.getElementById('capsave').disabled = true;
        return;
      }
      var img = document.getElementById('capimg');
      if (img.src && img.src.indexOf('blob:') === 0) { URL.revokeObjectURL(img.src); }
      img.src = URL.createObjectURL(res.img);
      document.getElementById('capwrap').style.display = 'inline-block';
      capRect01 = null; capDraw();
      document.getElementById('capsave').disabled = false;
      capSetStatus('拡大表示で開きました', false);
      var big = document.getElementById('capbigimg');
      big.src = img.src;
      capUploadDataUrl = null;
      document.getElementById('capuploadname').textContent = '';
      capMatchHide();
      if (capPendingBlock) {
        var pid = capPendingBlock; capPendingBlock = null;
        capOpenBlockModal(pid);
      } else {
        capModalOpen();
      }
      capFiltSoon(true);
    }).catch(function (e) { capSetStatus('取得できません: ' + e, true); });
  }
  document.getElementById('capget').addEventListener('click', capFetch);
  document.getElementById('capimg').addEventListener('mousedown', function (ev) {
    var r = this.getBoundingClientRect();
    dragStart = {
      x: (ev.clientX - r.left) / r.width,
      y: (ev.clientY - r.top) / r.height,
    };
    capRect01 = null; capDraw();
    ev.preventDefault();
  });
  window.addEventListener('mousemove', function (ev) {
    if (!dragStart) { return; }
    var img = document.getElementById('capimg');
    var r = img.getBoundingClientRect();
    var cur = {
      x: (ev.clientX - r.left) / r.width,
      y: (ev.clientY - r.top) / r.height,
    };
    capRect01 = PokeconCapture.normalizeDrag01(dragStart.x, dragStart.y, cur.x, cur.y);
    capDraw();
  });
  window.addEventListener('mouseup', function () { dragStart = null; });
  // テンプレ保存の共通手順。成功時は候補を更新してtpllistへ反映する。
  // afterSave があれば成功時に呼ぶ（bar3は枠消去、modalは開いたまま）。
  function capPostTemplate(name, rect01, img, statusFn, afterSave) {
    if (!rect01) { statusFn('画像上でドラッグして範囲を選んでください', true); return; }
    if (!img.naturalWidth) { statusFn('画像の読込中です。取り直してください', true); return; }
    if (!PokeconCapture.isValidPixels(rect01, img.naturalWidth, img.naturalHeight)) {
      statusFn('範囲が小さすぎます（実画像で8px未満の辺があります）', true);
      return;
    }
    if (!name.trim()) { statusFn('保存名を書いてください', true); return; }
    fetch('./template', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, rect: rect01 }),
    }).then(function (r) { return r.json(); }).then(function (j) {

    }
    var body = { lower: p.lower, upper: p.upper, mode: p.mode, source: p.source };
    if (capUploadDataUrl) { body.image = capUploadDataUrl.split(',', 2)[1]; }
    var filtImg = document.getElementById('capbigimg');
    if (document.getElementById('caproionly').checked) {
      if (!capModalRect || !filtImg.naturalWidth ||
          !PokeconCapture.isValidPixels(capModalRect, filtImg.naturalWidth, filtImg.naturalHeight)) {
        if (imgEl) { imgEl.style.display = 'none'; }
        capFiltSetRatio('赤枠を選んでください');
        return;
      }
      var fpx = PokeconCapture.rect01ToPx(capModalRect, filtImg.naturalWidth, filtImg.naturalHeight);
      body.crop = [fpx.x, fpx.y, fpx.x + fpx.width, fpx.y + fpx.height];
    } else {
      var filtTarget = capBlockMode ? ws.getBlockById(capBlockMode) : null;
      var filtHasH1 = !!(filtTarget && typeof filtTarget.getField === 'function' && filtTarget.getField('H1'));
      if (filtHasH1 && capModalRect && filtImg.naturalWidth &&
          PokeconCapture.isValidPixels(capModalRect, filtImg.naturalWidth, filtImg.naturalHeight)) {
        var cpx = PokeconCapture.rect01ToPx(capModalRect, filtImg.naturalWidth, filtImg.naturalHeight);
        body.crop = [cpx.x, cpx.y, cpx.x + cpx.width, cpx.y + cpx.height];
      }
    }
    capFiltSetRatio('計算しています…');
    fetch('./filter_preview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (document.getElementById('capmodal').style.display === 'none') { return; }
      if (!j || !j.ok) {
        if (imgEl) { imgEl.style.display = 'none'; }
        capFiltSetRatio((j && j.message) || '表示できません');
        return;
      }
      if (imgEl && j.image) {
        imgEl.src = 'data:image/png;base64,' + j.image;
        imgEl.style.display = '';
      }
      var ratio = parseFloat(j.ratio);
      capFiltSetRatio(isNaN(ratio) ? (j.message || '') : '割合 ' + (ratio * 100).toFixed(1) + '%');
    }).catch(function (e) {
      if (imgEl) { imgEl.style.display = 'none'; }
      capFiltSetRatio('表示できません: ' + e);
    });
  }
  function capFiltSoon(immediate) {
    if (capFiltTimer) { clearTimeout(capFiltTimer); capFiltTimer = null; }
    if (immediate) { capFilt(); return; }
    capFiltTimer = setTimeout(function () { capFiltTimer = null; capFilt(); }, 250);
  }
  document.getElementById('capth').addEventListener('input', function () {
    document.getElementById('caprth').value = this.value;
    capMatchSoon(false);
    capBlockSyncSoon();
  });
  document.getElementById('caprth').addEventListener('input', function () {
    document.getElementById('capth').value = this.value;
    capMatchSoon(false);
    capBlockSyncSoon();
  });
  document.getElementById('capmatchtpl').addEventListener('change', function () {
    capMatchSize();
    capMatchSoon(true);
  });
  document.getElementById('capgray').addEventListener('change', function () {
    capMatchSoon(true);
    capBlockSyncSoon();
  });
  document.getElementById('caproionly').addEventListener('change', function () {
    capMatchSoon(true);
  });
  ['caph1', 'caps1', 'capv1', 'caph2', 'caps2', 'capv2'].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) { return; }
    el.addEventListener('input', function () { capFiltSoon(false); capBlockSyncSoon(); });
  });
  (function () {
    var el = document.getElementById('capratio');
    if (!el) { return; }
    el.addEventListener('input', function () { capBlockSyncSoon(); });
  })();
  (function () {
    var el = document.getElementById('capfilt_mode');
    if (!el) { return; }
    el.addEventListener('change', function () { capFiltSoon(false); });
  })();
  document.getElementById('capupload').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) { return; }
    var reader = new FileReader();
    reader.onload = function () {
      var big = document.getElementById('capbigimg');
      big.src = reader.result;
      capUploadDataUrl = reader.result;
      document.getElementById('capuploadname').textContent = f.name + ' で試します';
      capModalSetStatus('手動画像を表示しました', false);
      capMatchSoon(true);
      capFiltSoon(true);
    };
    reader.readAsDataURL(f);
  });
  // 白枠の幅を表示画像に合わせる。fit-contentのままだと折り返し前の
  // 操作行の長さに引っ張られて右に余白ができるため。
  function capFitModalBox() {
    var img = document.getElementById('capbigimg');
    if (!img.offsetWidth) { return; }
    document.getElementById('capmodalbox').style.width = (img.offsetWidth + 24) + 'px';
  }
  document.getElementById('capbigimg').addEventListener('load', function () {
    if (document.getElementById('capmodal').style.display !== 'none') {
      capFitModalBox();
      capModalSyncSliderMax();
      capBlockPreload();
      capModalDraw(); capModalSyncInputs();
    }
  });
  // mousedownは枠・グリップからのバブルも受けるラッパで受ける。
  // 画像直付けでは枠上のクリックが届かない。
  document.getElementById('capbigwrap').addEventListener('mousedown', function (ev) {
    var r = document.getElementById('capbigimg').getBoundingClientRect();
    var nx = (ev.clientX - r.left) / r.width, ny = (ev.clientY - r.top) / r.height;
    var hit = PokeconCapture.hitHandle(capModalRect, nx, ny, 10 / Math.min(r.width, r.height));
    capHiDim([]);
    if (hit && hit !== 'inside') {
      capModalDrag = { mode: 'resize', handle: hit, sx: nx, sy: ny, orig: {
        x: capModalRect.x, y: capModalRect.y, width: capModalRect.width, height: capModalRect.height,
      } };
      document.getElementById('capbigimg').style.cursor = HANDLE_CURSORS[hit];
      capHiDim(HANDLE_DIMS[hit]);
    } else if (hit === 'inside') {
      capModalDrag = { mode: 'move', sx: nx, sy: ny, orig: {
        x: capModalRect.x, y: capModalRect.y, width: capModalRect.width, height: capModalRect.height,
      } };
      document.getElementById('capbigimg').style.cursor = 'move';
      capHiDim(['capx', 'capy']);
    } else {
      capModalDrag = { mode: 'new', sx: nx, sy: ny };
      capModalRect = null; capModalDraw();
    }
    ev.preventDefault();
  });
  window.addEventListener('mousemove', function (ev) {
    if (!capModalDrag) {
      // 待機中は位置に応じたカーソルだけ更新する（modal表示中のみ）。
      if (document.getElementById('capmodal').style.display === 'none') { return; }
      var hoverImg = document.getElementById('capbigimg');
      var hr = hoverImg.getBoundingClientRect();
      if (!hr.width || !hr.height) { return; }
      capHoverCursor((ev.clientX - hr.left) / hr.width, (ev.clientY - hr.top) / hr.height);
      return;
    }
    if (document.getElementById('capmodal').style.display === 'none') { return; }
    var img = document.getElementById('capbigimg');
    var r = img.getBoundingClientRect();
    var nx = (ev.clientX - r.left) / r.width, ny = (ev.clientY - r.top) / r.height;
    var d = capModalDrag;
    if (d.mode === 'new') {
      capModalRect = PokeconCapture.normalizeDrag01(d.sx, d.sy, nx, ny);
    } else if (d.mode === 'move') {
      capModalRect = PokeconCapture.moveRect01(d.orig, nx - d.sx, ny - d.sy);
    } else {
      capModalRect = PokeconCapture.resizeRect01(d.orig, d.handle, nx - d.sx, ny - d.sy);
    }
    capModalDraw(); capModalSyncInputs();
  });
  window.addEventListener('mouseup', function () {
    var wasDrag = !!capModalDrag;
    capModalDrag = null;
    document.getElementById('capbigimg').style.cursor = 'crosshair';
    if (wasDrag) { capMatchSoon(true); capBlockSync(); }
  });
  window.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && document.getElementById('capmodal').style.display !== 'none') {
      capModalClose();
    }
  });
  // 数値欄・スライダー共通の反映処理。v は実画像画素の {x, y, w, h}。
  // 入力途中の空欄・ハイフン等は黙って無視する（確定・保存時に改めて検証する）。
  function capApplyPx(v) {
    var img = document.getElementById('capbigimg');
    if (!img.naturalWidth) { capModalSetStatus('画像の読込中です。取り直してください', true); return; }
    if (isNaN(v.x) || isNaN(v.y) || isNaN(v.w) || isNaN(v.h)) { return; }
    if (v.w <= 0 || v.h <= 0) { capModalSetStatus('幅と高さは1以上にしてください', true); return; }
    capModalRect = PokeconCapture.pxToRect01(v.x, v.y, v.w, v.h, img.naturalWidth, img.naturalHeight);
    capModalDraw(); capModalSyncInputs();
    capHiDim([]);
    capMatchSoon(false);
    capBlockSyncSoon();
    if (!PokeconCapture.isValidPixels(capModalRect, img.naturalWidth, img.naturalHeight)) {
      capModalSetStatus('範囲が小さめです（実画像で8px未満の辺があります）', true);
    } else {
      capModalSetStatus('数値を反映しました', false);
    }
  }
  ['capx', 'capy', 'capw', 'caph'].forEach(function (id) {
    // ホイール・スピナー・キー入力のいずれもinputで拾う（changeはblur待ちになるため）。
    document.getElementById(id).addEventListener('input', function () {
      capApplyPx({
        x: parseInt(document.getElementById('capx').value, 10),
        y: parseInt(document.getElementById('capy').value, 10),
        w: parseInt(document.getElementById('capw').value, 10),
        h: parseInt(document.getElementById('caph').value, 10),
      });
    });
  });
  ['caprx', 'capry', 'caprw', 'caprh'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', function () {
      capApplyPx({
        x: parseInt(document.getElementById('caprx').value, 10),
        y: parseInt(document.getElementById('capry').value, 10),
        w: parseInt(document.getElementById('caprw').value, 10),
        h: parseInt(document.getElementById('caprh').value, 10),
      });
    });
  });
  document.getElementById('capok').addEventListener('click', function () {
    var img = document.getElementById('capbigimg');
    if (!capModalRect) { capModalSetStatus('範囲を選んでください', true); return; }
    if (!img.naturalWidth ||
        !PokeconCapture.isValidPixels(capModalRect, img.naturalWidth, img.naturalHeight)) {
      capModalSetStatus('範囲が小さすぎます（実画像で8px未満の辺があります）', true); return;
    }
    capRect01 = {
      x: capModalRect.x, y: capModalRect.y, width: capModalRect.width, height: capModalRect.height,
    };
    capDraw();
    capModalClose();
    capSetStatus('範囲を反映しました。保存名を書いて「切出し保存」を押してください', false);
  });
  document.getElementById('capcancel').addEventListener('click', capModalClose);
  document.getElementById('capmodalclose').addEventListener('click', capModalClose);
  document.getElementById('capmodalsave').addEventListener('click', function () {
    capPostTemplate(
      document.getElementById('capmodalname').value,
      capModalRect,
      document.getElementById('capbigimg'),
      capModalSetStatus,
      null);
  });
  document.getElementById('capretake').addEventListener('click', capFetch);
  // ---- 仮想スティック（pokecon_stick 用） ----
  // パッドのドラッグで角度（度）・強さ（%）を決め、数値欄とも連動する。
  // 「選択中へ反映」で選択中（なければ最後に触った）スティックブロックへ
  // 書き戻す。角度→座標の換算と生成コードは pokecon_blocks.js 側。
  // pointerイベント＋pad内完結にする（windowのmousemoveは既存modalと
  // 共有のため触らない）。
  (function () {
    var pad = document.getElementById('stickpad');
    if (!pad) { return; }
    var dot = document.getElementById('stickdot');
    var sideEl = document.getElementById('stickside');
    var angleEl = document.getElementById('stickangle');
    var magEl = document.getElementById('stickmag');
    var applyEl = document.getElementById('stickapply');
    if (!sideEl || !angleEl || !magEl || !applyEl) { return; }
    var R = 54; // ドット中心の可動半径（pad 120px・dot 12px）
    function setStatus(s, isErr) {
      var el = document.getElementById('stickstatus');
      if (!el) { return; }
      el.textContent = s;
      el.style.color = isErr ? '#c00' : '#333';
      el.style.fontWeight = isErr ? 'bold' : 'normal';
    }
    function normAngle(a) {
      a = a % 360;
      if (a < 0) { a += 360; }
      return a;
    }
    function readInputs() {
      var a = parseFloat(angleEl.value);
      var m = parseFloat(magEl.value);
      if (isNaN(a)) { a = 90; }
      if (isNaN(m)) { m = 100; }
      return { angle: normAngle(a), mag: Math.min(100, Math.max(0, m)) };
    }
    function draw() {
      if (!dot) { return; }
      var v = readInputs();
      var rad = v.angle * Math.PI / 180;
      var x = Math.cos(rad) * v.mag / 100 * R;
      var y = -Math.sin(rad) * v.mag / 100 * R;
      dot.style.left = (60 + x - 6) + 'px';
      dot.style.top = (60 + y - 6) + 'px';
    }
    function fromPoint(clientX, clientY) {
      var r = pad.getBoundingClientRect();
      var dx = clientX - (r.left + r.width / 2);
      var dy = clientY - (r.top + r.height / 2);
      var range = r.width / 2 - 6;
      // 8方向スナップ・強さ100%固定は PokeconStick が正本（本区画は非表示）。
      var v = { angle: 90, mag: 100 };
      try {
        if (Blockly.PokeconStick) {
          v = Blockly.PokeconStick.xyToAngleMag(dx, dy, range > 0 ? range : 0);
        }
      } catch (e) { /* 既定のまま */ }
      angleEl.value = String(v.angle);
      magEl.value = String(v.mag);
      draw();
    }
    var dragging = false;
    pad.addEventListener('pointerdown', function (ev) {
      dragging = true;
      try {
        if (pad.setPointerCapture && ev.pointerId !== undefined) {
          pad.setPointerCapture(ev.pointerId);
        }
      } catch (e) { /* 掴めなくてもドラッグは続ける */ }
      fromPoint(ev.clientX, ev.clientY);
      if (ev.preventDefault) { ev.preventDefault(); }
    });
    pad.addEventListener('pointermove', function (ev) {
      if (!dragging) { return; }
      fromPoint(ev.clientX, ev.clientY);
    });
    pad.addEventListener('pointerup', function () { dragging = false; });
    pad.addEventListener('pointercancel', function () { dragging = false; });
    angleEl.addEventListener('input', draw);
    magEl.addEventListener('input', draw);
    var lastId = null;
    ws.addChangeListener(function (e) {
      if (!e || e.type !== SELECTED_TYPE) { return; }
      var id = e.newElementId || null;
      var b = id ? ws.getBlockById(id) : null;
      if (b && b.type === 'pokecon_stick') {
        lastId = id;
        preload(b);
      } else if (id) {
        lastId = null;
      }
    });
    function preload(b) {
      try {
        var s = b.getFieldValue('STICK');
        if (s) { sideEl.value = s; }
        var pad = null;
        try {
          pad = b.getFieldValue('PAD');
        } catch (e) {
          pad = null;
        }
        var parsed = null;
        try {
          if (Blockly.PokeconStick) {
            parsed = Blockly.PokeconStick.parsePadValue(pad);
          }
        } catch (e) {
          parsed = null;
        }
        if (parsed) {
          angleEl.value = String(parsed.angle);
          magEl.value = String(parsed.mag);
        } else {
          var a = parseFloat(b.getFieldValue('ANGLE'));
          if (!isNaN(a)) { angleEl.value = String(Math.min(360, Math.max(0, a))); }
          var m = parseFloat(b.getFieldValue('MAG'));
          if (!isNaN(m)) { magEl.value = String(Math.min(100, Math.max(0, m))); }
        }
      } catch (e) { /* 読めなければ今の値を保つ */ }
      draw();
    }
    applyEl.addEventListener('click', function () {
      var target =
        (typeof Blockly.getSelected === 'function') ? Blockly.getSelected() : null;
      if (!target || target.type !== 'pokecon_stick') {
        target = lastId ? ws.getBlockById(lastId) : null;
      }
      if (!target || target.type !== 'pokecon_stick') {
        setStatus('スティックブロックを選んでください', true);
        return;
      }
      var a = parseFloat(angleEl.value);
      var m = parseFloat(magEl.value);
      if (isNaN(a) || a < 0 || a > 360) {
        setStatus('角度は0〜360で書いてください', true);
        return;
      }
      if (isNaN(m) || m < 0 || m > 100) {
        setStatus('強さは0〜100で書いてください', true);
        return;
      }
      target.setFieldValue(sideEl.value, 'STICK');
      // PAD欄があればそこへ書く（値の正規化は欄のvalidatorに任せる）。
      var hasPad = false;
      try {
        hasPad = (typeof target.getField === 'function') && !!target.getField('PAD');
      } catch (e) {
        hasPad = false;
      }
      if (hasPad) {
        target.setFieldValue(String(a) + ',' + String(m), 'PAD');
      }
      // 旧ANGLE/MAG欄つき（PAD以前の保存物）にも残す。無ければ何もしない。
      try {
        if ((typeof target.getField === 'function') && target.getField('ANGLE')) {
          target.setFieldValue(String(a), 'ANGLE');
        }
        if ((typeof target.getField === 'function') && target.getField('MAG')) {
          target.setFieldValue(String(m), 'MAG');
        }
      } catch (e) { /* 旧欄が無ければ何もしない */ }
      setStatus('反映しました', false);
    });
    draw();
  })();
  refreshFiles();
  refreshTemplates();
})();
</script>
</body>
</html>
